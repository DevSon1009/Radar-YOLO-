; ESP32-S3-N16R8 (16MB flash, 8MB PSRAM octal) + LD2410C
[platformio]
default_envs = firmware

[base]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Nếu cắm cáp vào cổng "USB" (native) thay vì cổng "COM/UART" thì bỏ dấu ; ở dòng dưới:
; build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ncmreynolds/ld2410
    bblanchon/ArduinoJson@^7.0.0

; ---- Bản chạy thật ----
[env:firmware]
extends = base
build_flags = -DCORE_DEBUG_LEVEL=1
build_src_filter = -<*> +<main.cpp>

; ---- Các bước thử từng phần ----
[env:stage1_hello]
extends = base
build_src_filter = -<*> +<stages/stage1_hello.cpp>

[env:stage2_radar]
extends = base
build_src_filter = -<*> +<stages/stage2_radar.cpp>

[env:stage3_outputs]
extends = base
build_src_filter = -<*> +<stages/stage3_outputs.cpp>

[env:stage4_wifi]
extends = base
build_src_filter = -<*> +<stages/stage4_wifi.cpp>
